# Copy to fly.toml, choose a globally unique app name and nearby region,
# then verify Fly.io's current UDP/IP requirements before deployment.
# For the simplest ENet path, allocate a dedicated public IPv4 for this app.
app = "replace-with-your-skoosh-server-name"
primary_region = "iad"

[build]
  dockerfile = "deploy/Dockerfile.server"

[[services]]
  protocol = "udp"
  internal_port = 9077
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 9077
